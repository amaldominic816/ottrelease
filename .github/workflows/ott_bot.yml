name: Auto Post OTT Releases to Telegram

on:
  schedule:
    # Runs at 04:00 and 12:00 UTC (09:30 AM and 05:30 PM IST) every day
    - cron: '0 4,12 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  post-movies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run OTT Telegram Poster
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBSITE_URL: "https://amaldominic816.github.io/ottrelease/"
        run: |
          python telegram_poster.py

      - name: Commit and push updated history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_ids.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update posted movie cache [skip ci]" && git push)
